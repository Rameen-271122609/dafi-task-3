##
## Nginx site for MediTrack
##
## Install:
##   sudo cp deploy/nginx/meditrack.conf /etc/nginx/sites-available/meditrack
##   sudo ln -s /etc/nginx/sites-available/meditrack /etc/nginx/sites-enabled/
##   sudo rm -f /etc/nginx/sites-enabled/default
##   sudo nginx -t && sudo systemctl reload nginx
##
## Replace meditrack.example.com with the real hostname before installing.
## Certbot rewrites this file when it issues the certificate; the TLS block
## below documents what it adds so the result can be checked by hand.
##

# Rate limit the auth endpoints so a stolen password list cannot be replayed
# at speed against Supabase.
limit_req_zone $binary_remote_addr zone=meditrack_auth:10m rate=12r/m;

upstream meditrack_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name meditrack.example.com;

    # Certbot's HTTP-01 challenge has to stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name meditrack.example.com;

    # --- Managed by Certbot -------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/meditrack.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meditrack.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    # ------------------------------------------------------------------------

    # Security headers. The app also sets these, but keeping them here means a
    # static error page served by Nginx is covered too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    server_tokens off;

    # Medical documents are capped at 10 MB by the storage bucket; allow a
    # little headroom for multipart overhead.
    client_max_body_size 12M;
    client_body_timeout  60s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    access_log /var/log/nginx/meditrack.access.log;
    error_log  /var/log/nginx/meditrack.error.log warn;

    # Immutable build output can be cached hard.
    location /_next/static/ {
        proxy_pass http://meditrack_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /api/health {
        proxy_pass http://meditrack_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location ~ ^/(login|signup|auth)/? {
        limit_req zone=meditrack_auth burst=10 nodelay;

        proxy_pass http://meditrack_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location / {
        proxy_pass http://meditrack_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_buffering       off;
    }
}
